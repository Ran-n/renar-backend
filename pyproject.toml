[project]
name = "renar-backend"
version = "0.4.0"
description = "FastAPI backend for Renar — your personal media tracker."
readme = "README.md"
authors = [{ name = "Ran#" }]
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.17",
    "httpx>=0.28",
    "pillow>=11.0",
    "blake3>=1.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
be = "renar_backend.__main__:run"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/renar_backend"]

[tool.pytest.ini_options]
filterwarnings = [
    # starlette's TestClient warns on every import that httpx should be
    # replaced by "httpx2" — that package isn't published on PyPI yet, so
    # there's nothing to migrate to. Silence until it actually exists.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.ruff]
src = ["src"]
target-version = "py314"
line-length = 120
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: these calls in argument defaults are intended
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
