[project]
name = "renar-backend"
version = "0.22.1"
description = "FastAPI backend for Renar — your personal media tracker."
readme = "README.md"
authors = [{ name = "Ran#" }]
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.17",
    "httpx>=0.28",
    "pillow>=11.0",
    "blake3>=1.0",
    "psycopg[binary]>=3.2",
    "py7zr>=0.22",
    "pyotp>=2.9",
    "segno>=1.6",
]

[project.scripts]
be = "renar_backend.__main__:run"
admin-totp = "renar_backend.admin_cli:totp"
admin-unban = "renar_backend.admin_cli:unban"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "bandit>=1.7", "pip-audit>=2.7", "locust>=2.31", "mutmut>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/renar_backend"]

# Explicit, root-anchored list: hatch only skips what .gitignore names, so
# local tool state (.claude/ with agent worktrees, .hypothesis/) would
# otherwise ship; unanchored "src" would also match .claude/worktrees/*/src.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/alembic",
    "/alembic.ini",
    "/docs",
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CONTRIBUTORS",
    "/LICENSE",
    "/TODO.md",
    "/.env.example",
]
exclude = ["__pycache__", "*.pyc"]

[tool.pytest.ini_options]
# Collect only tests/: a bare `pytest` otherwise walks into certs/, whose
# certbot live/ symlinks are unreadable on Windows and abort collection.
testpaths = ["tests"]
filterwarnings = [
    # starlette's TestClient warns on every import that httpx should be
    # replaced by "httpx2" — that package isn't published on PyPI yet, so
    # there's nothing to migrate to. Silence until it actually exists.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
markers = [
    "integration: boots the real app on a real socket (tests/integration/) instead of TestClient's in-process ASGI transport",
    "smoke: fast post-boot sanity check against a live server (tests/integration/)",
    "regression: curated critical-path subset, re-run after any change",
    "property: hypothesis-driven property-based test",
    "fuzz: hypothesis-driven fuzz test feeding malformed/random input at an API endpoint",
    "snapshot: compares a derived value against a checked-in baseline (tests/snapshots/); re-run with UPDATE_SNAPSHOTS=1 to accept an intentional change",
    "security: SAST (bandit) + dependency vulnerability (pip-audit) scan — hits the network, kept out of the default run",
    "load: headless locust run against a live_server (tests/integration/, tests/load/locustfile.py)",
]
# Spins up a real uvicorn process per session — seconds, not milliseconds —
# so it's kept out of the default `pytest` run. Select explicitly:
# `pytest -m integration` (works with any path filter too). security also
# needs network access (pip-audit queries a vulnerability database), so
# it's excluded the same way — `pytest -m security` to run it.
addopts = "-m \"not integration and not security\""

[tool.coverage.run]
source = ["src/renar_backend"]
branch = true

[tool.coverage.report]
# Baseline measurement per TODO.md's Testing entry — no threshold
# enforced yet (`pytest --cov` is meant to be read, not gated on, until the
# missing per-router property/fuzz/unit coverage it names is actually
# written). Run: `pytest --cov --cov-report=term-missing`.
show_missing = true
skip_empty = true

[tool.bandit]
# B608 (hardcoded_sql_expressions) false-positives on db_triggers.py's
# WATCH_MINUTES_TRIGGER_SQL/USER_COUNT_TRIGGER_SQL: f-strings, but the only
# interpolated values are this module's own compile-time constants
# (DEFAULT_*_RUNTIME), never user input — and bandit attributes the finding
# to the f-string's opening `f"""` line, where a trailing `# nosec` comment
# would corrupt the literal it opens, so this is a project-wide skip rather
# than a per-line suppression. tests/test_security_scan.py re-asserts B608
# doesn't appear anywhere else.
skips = ["B608"]
# _devserver.py is dev-only tooling (never imported by the production app)
# whose subprocess calls use only hard-coded, fixed-length argument lists —
# "netstat", "lsof", "taskkill" — with no user input ever interpolated.
# bandit's B404/B603/B607 findings there are genuine false-positives, and
# inline `# nosec` comments don't suppress them (bandit counts nosec: 0
# even when the comment is present, a known parsing quirk for this pattern).
# Match by bare filename, not a "src/.../_devserver.py" path: bandit compares
# this against the raw scanned path, which is backslash-separated on
# Windows — a forward-slash entry silently never matches there.
exclude_dirs = ["_devserver.py"]

[tool.mutmut]
# Mutation testing: mutates the listed source, re-runs `runner` per mutant,
# and reports which mutants survived (a test suite that still passes despite
# the code being subtly wrong — a gap the suite doesn't actually cover).
#
# UNVERIFIED on this machine: mutmut has no native Windows support (WSL/Linux
# only — confirmed by running `mutmut --help` here, which refuses outright
# and points at https://github.com/boxed/mutmut/issues/397) and this
# environment has no WSL installed. This config was written from mutmut's
# documented pyproject.toml schema, not proven by an actual run — verify it
# under WSL or Linux CI before trusting its results.
#
# Scoped to models.py + schemas.py rather than the whole src tree: full-repo
# mutation testing reruns the suite (real Postgres schema per test) once per
# mutant, which is impractically slow — start with the modules that already
# have the most example+property coverage (tests/test_property.py,
# tests/test_titles.py) and widen paths_to_mutate deliberately from there.
paths_to_mutate = ["src/renar_backend/models.py", "src/renar_backend/schemas.py"]
tests_dir = ["tests/"]
runner = "python -m pytest -x -q -m \"not integration and not security and not load\""

[tool.ruff]
src = ["src"]
target-version = "py314"
line-length = 120
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# The project's required file-header docstring (Authors/Created/Revised)
# has to precede Alembic's own revision docstring, which pushes every
# migration's imports below two docstrings — inherent to the convention,
# not fixable by reordering.
"alembic/versions/*.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: these calls in argument defaults are intended
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
