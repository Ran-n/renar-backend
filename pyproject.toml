[project]
name = "xoutaim-backend"
version = "0.1.0"
description = "FastAPI backend for Xoutaim — save and track films, TV shows and YouTube videos."
readme = "README.md"
authors = [{ name = "Ran#" }]
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.17",
    "httpx>=0.28",
    "pillow>=11.0",
    "blake3>=1.0",
]

[project.scripts]
be = "xoutaim_backend.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xoutaim_backend"]

[tool.ruff]
src = ["src"]
target-version = "py314"
line-length = 120
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
